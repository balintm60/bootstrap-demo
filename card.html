<!-- Dokumentáció: https://getbootstrap.com/docs/5.3/components/card/ -->
<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid p-4">
        <h1 class="text-center">Termékeink</h1>
        <div class="d-flex gap-4 justify-content-center">
            <div class="card w-25">
                <img src="https://picsum.photos/id/0/600/400" class="card-img-top" alt="Laptop">
                <div class="card-body">
                    <h5 class="card-title">Laptop</h5>
                    <p class="card-text">Nagy teljesítményű laptop 16 GB RAM-mal és 512 GB SSD-vel.</p>
                </div>
                <div class="card-footer text-end">
                    <p class="fw-bold text-primary mb-0">280 000 Ft</p>
                </div>
            </div>
            <div class="card w-25">
                <div class="position-relative">
                    <img src="https://picsum.photos/id/60/600/400" class="card-img-top" alt="Asztali PC">
                    <p class="badge bg-danger position-absolute top-0 end-0 px-3 py-2 m-2">AKCIÓ</p>
                </div>
                <div class="card-body">
                    <h5 class="card-title">Asztali PC</h5>
                    <p class="card-text">Erőteljes asztali számítógép modern hardverrel.</p>
                </div>
                <div class="card-footer text-end">
                    <p class="fw-bold text-danger mb-0">340 000 Ft</p>
                </div>
            </div>
            <div class="card w-25">
                <img src="https://picsum.photos/id/26/600/400" class="card-img-top" alt="Fejhallgató">
                <div class="card-body">
                    <h5 class="card-title">Fejhallgató</h5>
                    <p class="card-text">Vezetékes fejhallgató zajszűrő technológiával.</p>
                </div>
                <div class="card-footer text-end">
                    <p class="fw-bold text-primary mb-0">24 990 Ft</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
