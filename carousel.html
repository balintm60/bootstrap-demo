<!-- Dokumentáció: https://getbootstrap.com/docs/5.3/components/carousel/ -->
<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousel demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body>
  <div class="container p-4">
    <h1 class="text-center">Carousel demo</h1>
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2000">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://picsum.photos/id/1015/1920/1024" class="w-100" alt="Folyó">
        </div>
        <div class="carousel-item">
          <img src="https://picsum.photos/id/1018/1920/1024" class="w-100" alt="Hegyek">
        </div>
        <div class="carousel-item">
          <img src="https://picsum.photos/id/1025/1920/1024" class="w-100" alt="Kutya">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>
</body>

</html>
